<html>
<head>
    <title>Edit Task Prompt</title>
    <script type="module">
        import { store } from "/plugins/_scheduler/webui/scheduler/scheduler-store.js";
    </script>
</head>
<body>
    <div x-data>
        <template x-if="$store.schedulerStore">
            <div class="scheduler-expanded-prompt">
                <label for="scheduler-expanded-prompt" class="scheduler-form-label"
                       x-text="$store.schedulerStore.promptField === 'system_prompt' ? 'System Prompt' : 'User Prompt'"></label>
                <p id="scheduler-prompt-hint" class="scheduler-form-help">Changes stay in your draft. Save the task when you're done.</p>
                <textarea id="scheduler-expanded-prompt" rows="24"
                          aria-describedby="scheduler-prompt-hint"
                          x-model="$store.schedulerStore.editingTask[$store.schedulerStore.promptField]"
                          x-init="$nextTick(() => $el.focus())"></textarea>
            </div>
        </template>
        <div class="modal-footer" data-modal-footer>
            <button type="button" class="btn btn-ok" @click="$store.schedulerStore.closePromptEditor()">Done</button>
        </div>
    </div>
    <style>
        .scheduler-expanded-prompt textarea {
            box-sizing: border-box;
            width: 100%;
            height: 58dvh;
            min-height: 14rem;
            resize: vertical;
            line-height: 1.6;
            font-family: var(--font-family-main);
        }
    </style>
</body>
</html>
