<html class="browser-modal">

<head>
  <title>Browser</title>
  <script type="module">
    import { store } from "/plugins/_browser/webui/browser-store.js";
  </script>
</head>

<body class="browser-modal-body">
  <div x-data>
    <template x-if="$store.browserPage">
      <div class="browser-panel surface-workspace" x-create="$store.browserPage.onOpen($el, xAttrs($el) || {})" x-destroy="$store.browserPage.cleanup()"
        x-effect="$store.browserPage.handleSelectedContextChange($store.chats?.selected)"
        @keydown.window="$store.browserPage.handleKeydown($event)">
        <div class="browser-meta surface-tab-bar">
          <div class="browser-meta-top">
            <div class="browser-session-tabs" role="tablist" aria-label="Browser sessions">
              <template x-for="browser in $store.browserPage.visibleBrowsers()" :key="$store.browserPage.browserTabKey(browser)">
                <div class="browser-tab-shell" :class="{ 'is-active': $store.browserPage.isActiveBrowser(browser) }">
	                  <button type="button" class="browser-tab" role="tab"
	                    :aria-selected="$store.browserPage.isActiveBrowser(browser).toString()"
	                    :aria-busy="$store.browserPage.isBrowserLoading(browser).toString()"
	                    :title="$store.browserPage.browserTabTooltip(browser)"
	                    @click="$store.browserPage.selectBrowser(browser.id, browser.context_id)">
                    <x-icon class="browser-tab-icon" aria-hidden="true" name="language"></x-icon>
                    <span class="browser-tab-title" x-text="$store.browserPage.browserTabTitle(browser)"></span>
                  </button>
	                  <x-icon class="browser-tab-loading" aria-hidden="true"
	                    :class="{ 'is-visible': $store.browserPage.isBrowserLoading(browser), 'spinning': $store.browserPage.isBrowserLoading(browser) }"
	                    name="progress_activity"></x-icon>
	                  <button type="button" class="browser-tab-close"
	                    :title="'Close ' + $store.browserPage.browserTabLabel(browser)"
	                    :aria-label="'Close ' + $store.browserPage.browserTabLabel(browser)"
	                    :disabled="$store.browserPage.isClosingBrowser(browser.id, browser.context_id)"
	                    @pointerdown.stop
	                    @click.stop="$store.browserPage.closeBrowser(browser.id, browser.context_id)">
                    <x-icon name="close"></x-icon>
                  </button>
                </div>
              </template>
	              <button type="button" class="browser-new-tab surface-control" title="New Browser" aria-label="New Browser"
	                :disabled="$store.browserPage.isBusy()"
	                @click="$store.browserPage.openNewBrowser()">
                <x-icon name="add"></x-icon>
              </button>
            </div>

          </div>
        </div>

        <div class="browser-toolbar surface-toolbar">
          <div class="browser-navigation">
	            <button class="btn btn-icon-action surface-control" title="Back" aria-label="Back" @click="$store.browserPage.command('back')"
	              :disabled="!$store.browserPage.activeBrowserId || $store.browserPage.isBusy()">
              <x-icon name="arrow_back"></x-icon>
            </button>
	            <button class="btn btn-icon-action surface-control" title="Forward" aria-label="Forward" @click="$store.browserPage.command('forward')"
	              :disabled="!$store.browserPage.activeBrowserId || $store.browserPage.isBusy()">
              <x-icon name="arrow_forward"></x-icon>
            </button>
	            <button class="btn btn-icon-action surface-control" title="Reload" aria-label="Reload" @click="$store.browserPage.command('reload')"
	              :disabled="!$store.browserPage.activeBrowserId || $store.browserPage.isBusy()">
              <x-icon name="refresh"></x-icon>
            </button>
          </div>

          <div class="browser-session-controls surface-toolbar-group">
            <button type="button" class="btn browser-annotate-toggle surface-control surface-control-label" title="Annotate" aria-label="Annotate"
              :aria-pressed="$store.browserPage.annotating.toString()"
              :class="{ 'is-active': $store.browserPage.annotating }"
              :disabled="!$store.browserPage.canAnnotate() && !$store.browserPage.annotating"
              @click="$store.browserPage.toggleAnnotationMode()">
              <x-icon aria-hidden="true"
                :name="$store.browserPage.annotating ? 'rate_review' : 'edit_note'"></x-icon>
              <span x-text="$store.browserPage.annotating ? 'Annotating' : 'Annotate'"></span>
            </button>
            <div class="browser-extension-menu" @click.outside="$store.browserPage.closeExtensionsMenu()"
              @keydown.escape.window="$store.browserPage.closeExtensionsMenu()">
              <button type="button" class="btn btn-icon-action browser-extensions surface-control" title="Browser settings"
                aria-label="Browser settings" @click.stop="$store.browserPage.toggleExtensionsMenu()"
                :aria-expanded="$store.browserPage.extensionMenuOpen.toString()"
                :class="{ 'is-active': $store.browserPage.status?.extensions?.active }">
                <x-icon name="tune"></x-icon>
              </button>
              <div class="browser-extension-dropdown" x-show="$store.browserPage.extensionMenuOpen" x-transition
                style="display: none;">
                <div class="browser-extension-preset">
                  <label for="browser-model-preset">Browser LLM Preset</label>
                  <select id="browser-model-preset" x-model="$store.browserPage.modelPreset"
                    @change="$store.browserPage.setBrowserModelPreset($event.target.value)"
                    :disabled="$store.browserPage.modelPresetSaving">
                    <option value="">Default Main Model</option>
                    <template x-for="preset in $store.browserPage.modelPresetOptions" :key="preset.name">
                      <option :value="preset.name" x-text="preset.label"></option>
                    </template>
                  </select>
                  <div class="browser-extension-preset-summary" x-text="$store.browserPage.modelPresetSummary()">
                  </div>
                </div>
                <div class="browser-quick-location">
                  <div class="browser-quick-row">
                    <span>Browser</span>
                    <div class="browser-location-toggle" role="group" aria-label="Browser used by the agent">
                      <button type="button" :aria-pressed="($store.browserPage.runtimeBackend === 'host_required').toString()"
                        :disabled="$store.browserPage.runtimeBackendSaving"
                        @click="$store.browserPage.setRuntimeBackend('host_required')">Host</button>
                      <button type="button" :aria-pressed="($store.browserPage.runtimeBackend === 'container').toString()"
                        :disabled="$store.browserPage.runtimeBackendSaving"
                        @click="$store.browserPage.setRuntimeBackend('container')">Container</button>
                    </div>
                  </div>
                  <button type="button" class="browser-configure-host"
                    x-show="$store.browserPage.runtimeBackend === 'host_required'"
                    @click="$store.browserPage.openExtensionsSettings()">Configure host browser</button>
                </div>
                <div class="browser-quick-row browser-zoom-row">
                  <span>Zoom</span>
                  <div class="browser-zoom-actions">
                    <div class="browser-zoom-stepper" role="group" aria-label="Page zoom">
                      <button type="button" aria-label="Zoom out"
                        :disabled="!$store.browserPage.canZoom() || $store.browserPage.zoomPercent() <= 25"
                        @click="$store.browserPage.command('zoom', { direction: 'out' })"><x-icon name="remove"></x-icon></button>
                      <span class="browser-zoom-value" aria-live="polite" x-text="$store.browserPage.zoomPercent() + '%'">100%</span>
                      <button type="button" aria-label="Zoom in"
                        :disabled="!$store.browserPage.canZoom() || $store.browserPage.zoomPercent() >= 500"
                        @click="$store.browserPage.command('zoom', { direction: 'in' })"><x-icon name="add"></x-icon></button>
                    </div>
                    <button type="button" class="browser-zoom-reset" aria-label="Reset zoom"
                      :disabled="!$store.browserPage.canZoom() || $store.browserPage.zoomPercent() === 100"
                      @click="$store.browserPage.command('zoom', { direction: 'reset' })"><x-icon name="restart_alt"></x-icon></button>
                  </div>
                </div>
                <div class="browser-extension-list"
                  x-show="$store.browserPage.extensionsListLoading || $store.browserPage.extensionsList.length"
                  style="display: none;">
                  <div class="browser-extension-list-header">
                    <span>Chrome Extensions</span>
                    <x-icon class="spinning"
                      x-show="$store.browserPage.extensionsListLoading" name="progress_activity"></x-icon>
                  </div>
                  <template x-for="extension in $store.browserPage.extensionsList" :key="extension.path">
                    <div class="browser-extension-row">
                      <span class="browser-extension-row-text">
                        <span class="browser-extension-name" x-text="extension.name || 'Unnamed extension'"></span>
                        <span class="browser-extension-meta"
                          x-text="$store.browserPage.extensionVersionLabel(extension)"></span>
                      </span>
                      <span class="browser-extension-row-actions">
                        <button type="button" class="browser-extension-open"
                          x-show="$store.browserPage.extensionHasOpenUi(extension)"
                          :aria-label="$store.browserPage.extensionOpenTitle(extension)"
                          :disabled="!extension.enabled || $store.browserPage.isBusy()"
                          @click.stop="$store.browserPage.openExtensionUi(extension)">
                          <x-icon name="open_in_new"></x-icon>
                          <span>Open</span>
                        </button>
                        <label class="browser-extension-toggle">
                          <input type="checkbox" :checked="extension.enabled" :aria-label="'Enable ' + (extension.name || 'extension')"
                            :disabled="$store.browserPage.extensionToggleLoadingPath === extension.path"
                            @change="$store.browserPage.setExtensionEnabled(extension, $event.target.checked, $event.target)" />
                          <span class="browser-extension-switch"></span>
                        </label>
                      </span>
                    </div>
                  </template>
                </div>
                <button type="button" class="dropdown-item" @click="$store.browserPage.openExtensionsSettings()">
                  <x-icon name="tune"></x-icon>
                  <span>More settings</span>
                </button>
              </div>
            </div>
          </div>

          <form class="browser-address-form" aria-label="Browser navigation" @submit.prevent="$store.browserPage.go()">
            <x-icon class="browser-address-icon" name="language"></x-icon>
	            <input class="browser-address" aria-label="Browser address" name="browser_address" x-model="$store.browserPage.address"
	              @focus="$store.browserPage.onAddressFocus()" @blur="$store.browserPage.onAddressBlur()"
	              @keydown.enter.prevent="$store.browserPage.go()"
	              :disabled="$store.browserPage.isBusy()"
	              placeholder="https://example.com" autocomplete="off" />
          </form>
        </div>

        <div class="browser-stage" tabindex="0" @click="$el.focus()"
          :class="{ 'is-annotating': $store.browserPage.annotating }"
          @wheel.prevent="$store.browserPage.handleStageWheel($event)">
          <template x-if="$store.browserPage.isInteractiveSurface($el.parentElement)">
            <iframe class="browser-interactive-frame"
              :src="$store.browserPage.interactiveViewUrl"
              aria-label="Browser viewport"
              allow="clipboard-read; clipboard-write"
              @load="$store.browserPage.onInteractiveViewLoad()"></iframe>
          </template>
          <canvas class="browser-frame browser-frame-canvas"
            x-show="!$store.browserPage.usesInteractiveTransport() && $store.browserPage.frameCanvasReady"
            x-init="$store.browserPage.attachFrameCanvas($el)"
            @click="$store.browserPage.sendMouse('click', $event)"
            @mousemove.throttle.250ms="$store.browserPage.sendMouse('move', $event)"></canvas>
          <template x-if="!$store.browserPage.usesInteractiveTransport() && $store.browserPage.frameSrc">
            <img class="browser-frame browser-frame-image" :src="$store.browserPage.frameSrc"
              @click="$store.browserPage.sendMouse('click', $event)"
              @mousemove.throttle.250ms="$store.browserPage.sendMouse('move', $event)" draggable="false" />
          </template>
	          <template x-if="$store.browserPage.annotating && $store.browserPage.hasFrame()">
	            <div class="browser-annotation-layer"
	              :class="{ 'is-busy': $store.browserPage.annotationBusy }"
	              @pointerdown.stop.prevent="$store.browserPage.startAnnotationSelection($event)"
	              @pointermove.stop.prevent="$store.browserPage.moveAnnotationSelection($event)"
	              @pointerup.stop.prevent="$store.browserPage.finishAnnotationSelection($event)"
	              @pointercancel.stop.prevent="$store.browserPage.cancelAnnotationSelection($event)"
	              @pointerleave="$store.browserPage.clearAnnotationHover()">
	              <template x-if="$store.browserPage.annotationHover && !$store.browserPage.annotationDraft && !$store.browserPage.annotationDragRect">
	                <div class="browser-annotation-box is-hover"
	                  :style="$store.browserPage.annotationBoxStyle($store.browserPage.annotationHover.rect)">
	                  <span class="browser-annotation-hover-label"
	                    x-text="$store.browserPage.annotationHoverLabel()"></span>
	                </div>
	              </template>
	              <template x-for="annotation in $store.browserPage.visibleAnnotations()" :key="annotation.id">
	                <div class="browser-annotation-box is-saved"
	                  :style="$store.browserPage.annotationBoxStyle(annotation.rect)">
	                  <span class="browser-annotation-number" x-text="annotation.index"></span>
	                </div>
	              </template>
	              <template x-if="$store.browserPage.annotationDragRect">
	                <div class="browser-annotation-box is-draft"
	                  :style="$store.browserPage.annotationBoxStyle($store.browserPage.annotationDragRect)">
	                </div>
	              </template>
	            </div>
	          </template>
	          <template x-if="$store.browserPage.annotationDraft">
	            <div class="browser-annotation-popover"
	              :style="$store.browserPage.annotationPopoverStyle()"
	              @click.stop @pointerdown.stop @keydown.stop>
	              <div class="browser-annotation-popover-title">
	                <span class="browser-annotation-popover-heading">
	                  <span class="browser-annotation-number" x-text="$store.browserPage.nextAnnotationIndex()"></span>
	                  <span x-text="$store.browserPage.annotationDraftTitle()"></span>
	                </span>
	                <button type="button" class="browser-annotation-popover-close"
	                  title="Cancel annotation" aria-label="Cancel annotation"
	                  @click="$store.browserPage.cancelAnnotationDraft()">
	                  <x-icon name="close"></x-icon>
	                </button>
	              </div>
	              <textarea x-model="$store.browserPage.annotationDraftText" placeholder="Comment"
	                maxlength="1200" x-init="$nextTick(() => $el.focus())"></textarea>
	              <div class="browser-annotation-actions">
	                <button type="button" class="browser-annotation-mic mic-inactive"
	                  data-whisper-microphone title="Record annotation comment"
	                  aria-label="Record annotation comment"
	                  x-init="$nextTick(() => $store.browserPage.syncAnnotationMicrophoneUI())"
	                  @click="$store.browserPage.startAnnotationVoice(true)">
	                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 18" fill="currentColor" aria-hidden="true">
	                    <path d="m8,12c1.66,0,3-1.34,3-3V3c0-1.66-1.34-3-3-3s-3,1.34-3,3v6c0,1.66,1.34,3,3,3Zm-1,1.9c-2.7-.4-4.8-2.6-5-5.4H0c.2,3.8,3.1,6.9,7,7.5v2h2v-2c3.9-.6,6.8-3.7,7-7.5h-2c-.2,2.8-2.3,5-5,5.4h-2Z" />
	                  </svg>
	                </button>
	                <button type="button" class="browser-annotation-send"
	                  title="Add annotation" aria-label="Add annotation"
	                  :disabled="!String($store.browserPage.annotationDraftText || '').trim()"
	                  @click="$store.browserPage.addAnnotationComment()">
	                  <x-icon name="arrow_forward"></x-icon>
	                </button>
	              </div>
	            </div>
	          </template>
	          <div class="browser-annotation-tray"
	            x-show="$store.browserPage.pendingAnnotations().length"
	            :class="{ 'is-floating': $store.browserPage.annotationTrayPosition, 'is-dragging': $store.browserPage.annotationTrayDragging }"
	            :style="$store.browserPage.annotationTrayStyle()"
	            x-transition style="display: none;"
	            @click.stop @pointerdown.stop @keydown.stop
	            @pointermove.window="$store.browserPage.moveAnnotationTrayDrag($event)"
	            @pointerup.window="$store.browserPage.finishAnnotationTrayDrag($event)"
	            @pointercancel.window="$store.browserPage.finishAnnotationTrayDrag($event)">
	            <div class="browser-annotation-tray-header"
	              @pointerdown.stop="$store.browserPage.startAnnotationTrayDrag($event)">
	              <span x-text="$store.browserPage.annotationBatchLabel()"></span>
	              <button type="button" class="browser-annotation-clear" title="Clear annotations"
	                aria-label="Clear annotations" @click="$store.browserPage.clearPendingAnnotations()">
	                <x-icon name="delete"></x-icon>
	              </button>
	            </div>
	            <div class="browser-annotation-chips">
	              <template x-for="annotation in $store.browserPage.pendingAnnotations()" :key="annotation.id">
	                <div class="browser-annotation-chip" :title="annotation.title + ' — ' + annotation.url">
	                  <span class="browser-annotation-number" x-text="annotation.index"></span>
	                  <span class="browser-annotation-chip-text" x-text="annotation.comment"></span>
	                  <button type="button" title="Remove annotation" aria-label="Remove annotation"
	                    @click="$store.browserPage.removeAnnotationComment(annotation.id)">
	                    <x-icon name="close"></x-icon>
	                  </button>
	                </div>
	              </template>
	            </div>
	            <div class="browser-annotation-tray-actions">
	              <button type="button" class="browser-annotation-mic mic-inactive"
	                data-whisper-microphone title="Record annotation instruction"
	                aria-label="Record annotation instruction"
	                x-init="$nextTick(() => $store.browserPage.syncAnnotationMicrophoneUI())"
	                @click="$store.browserPage.startAnnotationVoice()">
	                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 18" fill="currentColor" aria-hidden="true">
	                  <path d="m8,12c1.66,0,3-1.34,3-3V3c0-1.66-1.34-3-3-3s-3,1.34-3,3v6c0,1.66,1.34,3,3,3Zm-1,1.9c-2.7-.4-4.8-2.6-5-5.4H0c.2,3.8,3.1,6.9,7,7.5v2h2v-2c3.9-.6,6.8-3.7,7-7.5h-2c-.2,2.8-2.3,5-5,5.4h-2Z" />
	                </svg>
	              </button>
	              <button type="button" class="browser-annotation-send"
	                title="Send annotations" aria-label="Send annotations"
	                @click="$store.browserPage.sendAnnotationsToChat()">
	                <x-icon name="arrow_forward"></x-icon>
	              </button>
	            </div>
	          </div>
	          <template x-if="!$store.browserPage.hasFrame() && !$store.browserPage.isBusy()">
            <div class="browser-empty">
              <x-icon name="captive_portal"></x-icon>
              <button class="btn btn-field" @click="$store.browserPage.command('open')">Open
                Browser</button>
            </div>
          </template>
	          <template x-if="!$store.browserPage.hasFrame() && $store.browserPage.isBusy()">
	            <div class="browser-empty browser-starting" role="status" aria-live="polite">
	              <x-icon class="spinning" name="progress_activity"></x-icon>
	              <span x-text="$store.browserPage.browserLoadingLabel()"></span>
	            </div>
	          </template>
        </div>

        <template x-if="$store.browserPage.error">
          <div class="browser-bottom-status has-error">
            <div class="browser-error" x-text="$store.browserPage.error" :title="$store.browserPage.error"></div>
          </div>
        </template>
      </div>
    </template>
  </div>

  <style>
    .modal-inner.browser-modal {
      box-sizing: border-box;
      container-type: inline-size;
      width: min(78vw, 1120px);
      height: min(88vh, 900px);
      min-width: min(320px, calc(100vw - 16px));
      min-height: min(480px, calc(100vh - 16px));
      max-width: calc(100vw - 16px);
      max-height: calc(100vh - 16px);
      resize: both;
      border: 1px solid color-mix(in srgb, var(--color-border) 75%, transparent);
      border-radius: 7px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      background: color-mix(in srgb, var(--color-background) 94%, #000 6%);
    }

    .modal-inner.browser-modal.is-focus-mode {
      resize: none;
      border-radius: 6px;
    }

    .modal-inner.browser-modal.is-focus-mode .browser-modal-focus-button {
      color: var(--color-text);
      border-color: color-mix(in srgb, var(--color-primary) 42%, var(--color-border));
      background: color-mix(in srgb, var(--color-primary) 16%, var(--color-background));
    }

    .modal.modal-floating {
      pointer-events: none;
    }

    .modal.modal-floating .modal-inner {
      pointer-events: auto;
    }

    .modal-inner.browser-modal .modal-header {
      cursor: move;
      user-select: none;
      background: color-mix(in srgb, var(--color-background) 92%, #000 8%);
      border-bottom: 1px solid color-mix(in srgb, var(--color-border) 70%, transparent);
    }

    .modal-inner.browser-modal .modal-close {
      font-size: 1.35rem;
      line-height: 1;
    }

    .modal-inner.browser-modal .modal-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      padding: 0;
    }

    .modal-inner.browser-modal .modal-bd.browser-modal-body {
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 0;
      min-height: 0;
    }

	    .modal-inner.browser-modal .modal-bd.browser-modal-body>x-component,
	    .modal-inner.browser-modal .modal-bd.browser-modal-body>x-component>div,
	    .modal-inner.browser-modal .modal-bd.browser-modal-body>div {
	      display: flex;
	      flex: 1 1 auto;
	      width: 100%;
	      height: 100%;
	      min-width: 0;
	      min-height: 0;
	    }

	    .modal-inner.browser-modal .browser-panel {
	      height: 100%;
	      max-height: 100%;
	      overflow: hidden;
	    }

    .browser-panel {
      --browser-chrome-surface: var(--surface-chrome);
      --browser-chrome-border: color-mix(in srgb, var(--color-border) 58%, transparent);
      --browser-tab-hover-border: color-mix(in srgb, var(--color-border) 78%, transparent);
      --browser-control-size: 32px;
      --browser-address-height: 34px;
      --browser-tab-height: 36px;
      --browser-tab-close-size: 32px;
      --browser-control-radius: 0.55rem;
      box-sizing: border-box;
      container-type: inline-size;
      display: flex;
      flex: 1 1 auto;
	      flex-direction: column;
	      gap: 0;
	      height: 100%;
	      min-height: 0;
	      position: relative;
    }

    .browser-toolbar {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      grid-template-areas: "nav address controls";
      gap: 8px;
      align-items: center;
      padding: 8px 10px 9px;
      border-bottom: 0;
      background: transparent;
    }

    .browser-navigation {
      grid-area: nav;
      display: flex;
      gap: 6px;
    }

    .browser-panel .btn-icon-action,
    .browser-new-tab {
      width: var(--browser-control-size);
      min-width: var(--browser-control-size);
      height: var(--browser-control-size);
      min-height: var(--browser-control-size);
      border-radius: var(--browser-control-radius);
    }

    .browser-panel .btn-icon-action {
      color: color-mix(in srgb, var(--color-text) 72%, var(--color-primary) 28%);
      background: color-mix(in srgb, var(--color-background) 26%, transparent);
      border-color: var(--browser-chrome-border);
    }

    .browser-panel .btn-icon-action:hover:not(:disabled) {
      color: var(--color-text);
      border-color: color-mix(in srgb, var(--color-primary) 34%, var(--browser-chrome-border));
      background: color-mix(in srgb, var(--color-background-hover) 62%, transparent);
      box-shadow: none;
    }

    .browser-panel .btn-icon-action .material-symbols-outlined {
      font-size: 1.12rem;
    }

    .browser-address-form {
      grid-area: address;
      min-width: 0;
      position: relative;
      margin: 0;
    }

    .browser-address-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      opacity: 0.58;
      pointer-events: none;
    }

    .browser-address {
      width: 100%;
      min-height: var(--browser-address-height);
      padding: 5px 10px 5px 34px;
      border-radius: var(--browser-control-radius);
      border: 1px solid var(--browser-chrome-border);
      background: var(--color-input);
      color: var(--color-text);
      font: inherit;
    }

    .browser-meta {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 0;
      padding: 7px 10px 0;
      border-bottom: 1px solid var(--browser-chrome-border);
      background: var(--browser-chrome-surface);
    }

    .browser-meta-top {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 10px;

      height: 1.5rem;
      font-size: 1.78rem;
    }

    @keyframes browser-mic-pulse {
      50% { transform: scale(1.1); }
    }

    .browser-empty {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      font-size: 0.88rem;
    }

    .browser-bottom-status {
      display: flex;
      align-items: center;
      flex: 0 0 24px;
      min-height: 24px;
      max-height: 24px;
      min-width: 0;
      padding: 0 10px;
      overflow: hidden;
      border-top: 1px solid color-mix(in srgb, var(--color-border) 58%, transparent);
      background: color-mix(in srgb, var(--color-background) 95%, #000 5%);
      color: color-mix(in srgb, var(--color-text) 74%, transparent);
      font-size: 0.76rem;
      line-height: 1;
    }

    .browser-bottom-status.has-error {
      color: #fca5a5;
      background: color-mix(in srgb, #7f1d1d 22%, var(--color-background));
    }

    .browser-error {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
      white-space: nowrap;
    }

    .browser-error {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

	    .browser-modal .spinning,
    .browser-panel .spinning {
      display: inline-block;
      transform-origin: center;
      animation: browser-spin 0.8s linear infinite;
    }

    @keyframes browser-spin {
      to {
        transform: rotate(360deg);
      }
    }

    .browser-empty {
      display: grid;
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      justify-items: center;
      align-content: center;
      text-align: center;
      padding: 24px;
      color: var(--color-text);
    }

    .browser-starting .material-symbols-outlined {
      font-size: 1.45rem;
    }

    @container (max-width: 460px) {
      .browser-toolbar {
        grid-template-columns: auto minmax(0, 1fr) auto;
        grid-template-areas:
          "nav . controls"
          "address address address";
        align-items: center;
        gap: 7px;
      }

      .browser-navigation {
        justify-content: flex-start;
      }

      .browser-address-form {
        width: 100%;
      }

      .browser-meta-top {
        grid-template-columns: minmax(0, 1fr);
      }

      .browser-session-controls {
        width: auto;
        justify-content: flex-end;
      }

      .browser-session-tabs {
        width: 100%;
      }

      .browser-tab-shell {
        flex-basis: 170px;
        min-width: 142px;
      }

      .browser-new-tab,
      .browser-session-controls .btn-icon-action {
        width: var(--browser-control-size);
        height: var(--browser-control-size);
      }

      .browser-panel button.browser-annotate-toggle {
        width: var(--browser-control-size);
        min-width: var(--browser-control-size);
        padding: 0;
      }

      .browser-annotate-toggle span:not(.material-symbols-outlined) {
        display: none;
      }

      .browser-extension-dropdown {
        right: 0;
        left: auto;
        top: calc(var(--browser-control-size) + var(--browser-address-height) + 13px);
        width: min(296px, calc(100vw - 72px));
      }

      .browser-address {
        min-height: var(--browser-address-height);
      }
    }
  </style>
