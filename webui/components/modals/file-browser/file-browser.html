<html
  class="surface-modal file-browser-modal modal-no-backdrop"
  data-surface-id="files"
  data-surface-modal-path="modals/file-browser/file-browser.html"
  data-surface-dock-title="Open Files in canvas"
  data-surface-dock-icon="dock_to_right"
  data-canvas-surface="files"
  data-canvas-modal-path="modals/file-browser/file-browser.html"
  data-canvas-dock-title="Open Files in canvas"
  data-canvas-dock-icon="dock_to_right"
>
  <head>
    <title>File Browser</title>
    <script type="module">
      import { store } from "/components/modals/file-browser/file-browser-store.js";
    </script>
  </head>
  <body class="file-browser-modal-body">
    <div
      x-data
      class="file-browser-shell surface-workspace"
      :class="{ 'is-surface': xAttrs($el)?.mode === 'canvas' }"
      x-create="$store.fileBrowser.onMount($el, xAttrs($el) || {})"
      x-destroy="$store.fileBrowser.onUnmount($el)"
    >
      <template x-if="$store.fileBrowser">
        <div
          class="file-browser-root"
          x-data="{
            pathRoot: $el, menu: '', menuStyle: {}, menuTrigger: null, crumbsOverflow: 0,
            closeMenu(restoreFocus = false) { this.menu = ''; this.menuStyle = {}; if (restoreFocus) this.menuTrigger?.focus(); },
            toggleMenu(name, trigger, width) {
              const opening = this.menu !== name;
              this.closeMenu();
              $store.fileBrowser.closeDropdown();
              if (opening) {
                this.menuTrigger = trigger; this.menuStyle = $store.fileBrowser.getDropdownStyle(trigger, width); this.menu = name;
                $nextTick(() => Array.from($refs[name + 'Menu']?.querySelectorAll('button') || []).find(button => button.checkVisibility())?.focus({preventScroll: true}));
              }
            }
          }"
          x-effect="$store.fileBrowser.fileTree.follow($store.fileBrowser.browser.currentPath); $store.fileBrowser.isLoading; closeMenu()"
          @resize.window="closeMenu(); $store.fileBrowser.clearPathSuggestions()"
          @scroll.window.capture="if (!$event.target.closest?.('.path-navigator, .path-suggestions, .path-overflow-menu')) { closeMenu(); $store.fileBrowser.clearPathSuggestions(); }"
          @keydown.escape.window.capture="if (menu) { $event.stopPropagation(); closeMenu(true); }"
          :class="{ 'is-surface': xAttrs($el)?.mode === 'canvas' }"
        >
          <!-- File Browser Content -->
          <div class="file-browser-content">
            <!-- Path navigator -->
            <div class="path-navigator-wrap">
              <form class="path-navigator surface-toolbar" @submit.prevent="$store.fileBrowser.submitPath()">
                <button
                  type="button"
                  class="file-browser-header-button surface-control nav-history-button"
                  @click="$store.fileBrowser.navigateBack()"
                  :disabled="!$store.fileBrowser.history.length || $store.fileBrowser.isLoading"
                  aria-label="Go back"
                  title="Go back"
                >
                  <x-icon aria-hidden="true" name="arrow_back"></x-icon>
                </button>
                <button
                  type="button"
                  class="file-browser-header-button surface-control nav-history-button"
                  @click="$store.fileBrowser.navigateForward()"
                  :disabled="!$store.fileBrowser.forwardHistory.length || $store.fileBrowser.isLoading"
                  aria-label="Go forward"
                  title="Go forward"
                >
                  <x-icon aria-hidden="true" name="arrow_forward"></x-icon>
                </button>
                <template x-if="$store.fileBrowser.preferences.pathBar === 'raw' || $store.fileBrowser.pathEditing">
                  <div class="path-edit-group">
                    <button
                      type="button"
                      class="nav-button back-button surface-control"
                      x-show="$store.fileBrowser.preferences.pathBar === 'raw'"
                      @click="$store.fileBrowser.navigateUp()"
                      @dragover="$store.fileBrowser.setDropTarget($store.fileBrowser.browser.parentPath, $event)"
                      @dragleave="$store.fileBrowser.clearDropTarget($store.fileBrowser.browser.parentPath, $event)"
                      @drop="$store.fileBrowser.dropItems($store.fileBrowser.browser.parentPath, 'parent folder', $event)"
                      :class="{ 'is-drop-target': $store.fileBrowser.dragOverPath === $store.fileBrowser.browser.parentPath }"
                      :disabled="!$store.fileBrowser.browser.parentPath || $store.fileBrowser.isLoading"
                      aria-label="Navigate up"
                      title="Navigate up"
                    >
                      <x-icon aria-hidden="true" name="arrow_upward"></x-icon>
                      <span class="nav-button-label">Up</span>
                    </button>
                    <div class="path-input-shell" :class="{ 'has-error': $store.fileBrowser.pathError }" @mousedown.self.prevent @click.self="$store.fileBrowser.focusPathInput($el)">
                      <input
                        id="current-path"
                        class="path-input"
                        type="text"
                        x-model="$store.fileBrowser.pathInput"
                        x-create="$store.fileBrowser.pinPathInput($el); if ($store.fileBrowser.pathEditing) $nextTick(() => { if ($el.checkVisibility({checkOpacity: true})) $el.focus(); })"
                        x-effect="$store.fileBrowser.pathInput; $store.fileBrowser.scrollPathInputNextFrame($el)"
                        x-destroy="$el._pinResizeObserver?.disconnect()"
                        @input="$store.fileBrowser.queuePathSuggestions($el)"
                        @focus="$store.fileBrowser.showPathSuggestions($el)"
                        @blur="$store.fileBrowser.hidePathSuggestions(); $store.fileBrowser.pinPathInputAfterBlur($el)"
                        @keydown.arrow-down="if ($store.fileBrowser.movePathSuggestion(1)) $event.preventDefault()"
                        @keydown.arrow-up="if ($store.fileBrowser.movePathSuggestion(-1)) $event.preventDefault()"
                        @keydown.tab="if (!$event.shiftKey && $store.fileBrowser.selectPathSuggestion($el)) { $event.preventDefault(); $el.focus(); }"
                        @keydown.escape.stop.prevent="$store.fileBrowser.exitPathEdit(true)"
                        :aria-invalid="$store.fileBrowser.pathError ? 'true' : 'false'"
                        aria-label="Directory path"
                        spellcheck="false"
                        autocomplete="off"
                      />
                      <button
                        :type="$store.fileBrowser.pathEditing ? 'submit' : 'button'"
                        class="file-browser-header-button path-submit"
                        @mousedown.prevent
                        @click="if (!$store.fileBrowser.pathEditing) $store.fileBrowser.focusPathInput($el)"
                        :class="{ 'is-submitting': $store.fileBrowser.isPathSubmitting || $store.fileBrowser.isLoading }"
                        :disabled="$store.fileBrowser.isPathSubmitting || $store.fileBrowser.isLoading"
                        :aria-label="$store.fileBrowser.pathEditing ? 'Go to directory' : 'Edit directory path'"
                      >
                      </button>
                    </div>
                  </div>
                </template>
                <template x-if="$store.fileBrowser.preferences.pathBar !== 'raw' && !$store.fileBrowser.pathEditing">
                  <div class="path-buttons-group" @click.self="$store.fileBrowser.startPathEdit()">
                    <button
                      type="button"
                      class="path-overflow-up"
                      :class="{ 'is-hidden': !crumbsOverflow }"
                      @click="toggleMenu('ancestors', $el, 220)"
                      :disabled="!$store.fileBrowser.browser.parentPath || $store.fileBrowser.isLoading"
                      :aria-expanded="menu === 'ancestors' ? 'true' : 'false'"
                      aria-label="Parent folders"
                      title="Parent folders"
                    >
                      <x-icon aria-hidden="true" name="chevron_left"></x-icon>
                    </button>
                    <template x-teleport="body">
                      <div
                        class="path-overflow-menu"
                        x-ref="ancestorsMenu"
                        x-show="menu === 'ancestors'"
                        :style="menuStyle"
                        @click.outside="closeMenu()"
                      >
                        <template x-for="ancestor in $store.fileBrowser.pathCrumbs().slice(0, crumbsOverflow)" :key="ancestor.path">
                          <button type="button" class="path-ancestor dropdown-item" @click="closeMenu(); $store.fileBrowser.navigateToFolder(ancestor.path)">
                            <x-icon aria-hidden="true" name="folder"></x-icon><span x-text="ancestor.name"></span>
                          </button>
                        </template>
                      </div>
                    </template>
                    <div
                      class="path-crumbs"
                      role="navigation"
                      aria-label="Directory path"
                      x-data="{ measure() { requestAnimationFrame(() => { crumbsOverflow = $store.fileBrowser.measurePathCrumbFit($el, crumbsOverflow); }); } }"
                      x-create="$el._crumbFitObserver = new ResizeObserver(() => measure()); $el._crumbFitObserver.observe($el)"
                      x-destroy="$el._crumbFitObserver.disconnect()"
                      x-effect="$store.fileBrowser.pathCrumbs(); measure()"
                      @click.self="$store.fileBrowser.startPathEdit()"
                    >
                      <template x-for="(crumb, index) in $store.fileBrowser.pathCrumbs()" :key="crumb.path">
                        <button
                          type="button"
                          class="path-crumb"
                          :class="{ 'is-active': index === $store.fileBrowser.pathCrumbs().length - 1, 'is-drop-target': $store.fileBrowser.dragOverPath === crumb.path }"
                          @click="$store.fileBrowser.navigateToFolder(crumb.path)"
                          @dragover="$store.fileBrowser.setDropTarget(crumb.path, $event)"
                          @dragleave="$store.fileBrowser.clearDropTarget(crumb.path, $event)"
                          @drop="$store.fileBrowser.dropItems(crumb.path, crumb.name, $event)"
                          :disabled="$store.fileBrowser.isLoading"
                        >
                          <span class="path-crumb-name" x-text="crumb.name"></span
                          ><span class="path-crumb-separator" aria-hidden="true" x-show="index < $store.fileBrowser.pathCrumbs().length - 1">›</span>
                        </button>
                      </template>
                    </div>
                    <button type="button" class="path-edit-toggle" :class="{ 'is-loading': $store.fileBrowser.isLoading }"
                      :disabled="$store.fileBrowser.isLoading" aria-label="Edit directory path" @click="$store.fileBrowser.startPathEdit()">
                    </button>
                  </div>
                </template>
                <template x-teleport="body">
                  <div
                    class="path-suggestions"
                    x-show="$store.fileBrowser.pathSuggestions.length && $store.fileBrowser.pathSuggestionsOwner?.closest('.file-browser-root') === pathRoot && !$store.fileBrowser.pathError"
                    :style="$store.fileBrowser.pathSuggestionsStyle"
                  >
                    <template x-for="(suggestion, index) in $store.fileBrowser.pathSuggestions" :key="suggestion.path">
                      <button
                        type="button"
                        class="path-suggestion dropdown-item"
                        :class="{ 'is-active': index === $store.fileBrowser.pathSuggestionIndex }"
                        @mousedown.prevent
                        @click="$store.fileBrowser.pickPathSuggestion(suggestion)"
                        @mouseenter="$store.fileBrowser.pathSuggestionIndex = index"
                      >
                        <x-icon aria-hidden="true" name="folder"></x-icon><span x-text="suggestion.name"></span>
                      </button>
                    </template>
                  </div>
                </template>
                <span class="surface-toolbar-separator" aria-hidden="true" x-show="!$store.fileBrowser.isTextOpenPicker()"></span>
                <button
                  type="button"
                  class="file-browser-header-button btn-new-item surface-control"
                  x-show="$store.fileBrowser.remoteAllowed('upload') && !$store.fileBrowser.isTextOpenPicker()"
                  @click="toggleMenu('new', $el, 180)"
                  :aria-expanded="menu === 'new' ? 'true' : 'false'"
                  aria-label="Create new"
                  title="Create new"
                >
                  <x-icon aria-hidden="true" name="add"></x-icon>
                </button>
                <template x-teleport="body">
                  <div
                    class="path-overflow-menu new-items-menu"
                    x-ref="newMenu"
                    x-show="menu === 'new'"
                    :style="menuStyle"
                    @click.outside="closeMenu()"
                  >
                    <button
                      type="button"
                      class="new-item dropdown-item"
                      x-show="!$store.fileBrowser.isPickerMode() && $store.fileBrowser.remoteAllowed('upload') && $store.fileBrowser.remoteAllowed('edit')"
                      @click="closeMenu(); $store.fileBrowser.openNewFile()"
                      aria-label="New file"
                      title="New file"
                    >
                      <x-icon aria-hidden="true" name="note_add"></x-icon><span>New file</span>
                    </button>
                    <button
                      type="button"
                      class="new-item dropdown-item"
                      x-show="!$store.fileBrowser.isTextOpenPicker() && $store.fileBrowser.remoteAllowed('upload')"
                      @click="closeMenu(); $store.fileBrowser.beginNewFolder()"
                      aria-label="New folder"
                      title="New folder"
                    >
                      <x-icon aria-hidden="true" name="create_new_folder"></x-icon><span>New folder</span>
                    </button>
                  </div>
                </template>
                <span class="surface-toolbar-separator" aria-hidden="true"></span>
                <button
                  type="button"
                  class="file-browser-header-button surface-control"
                  title="Toggle file tree"
                  aria-label="Toggle file tree"
                  :aria-pressed="String($store.fileBrowser.fileTree.shown)"
                  @click="$store.fileBrowser.fileTree.toggle($store.fileBrowser.browser.currentPath)"
                >
                  <x-icon name="account_tree"></x-icon>
                </button>
                <button
                  type="button"
                  class="file-browser-header-button surface-control"
                  x-show="!$store.fileBrowser.isPickerMode()"
                  @click="$store.fileBrowser.openSettings()"
                  title="File Browser Settings"
                  aria-label="File Browser Settings"
                >
                  <x-icon aria-hidden="true" name="settings"></x-icon>
                </button>
              </form>
              <template x-if="$store.fileBrowser.pathError">
                <div class="path-error" x-text="$store.fileBrowser.pathError"></div>
              </template>
            </div>
            <div x-show="$store.fileBrowser.selectedCount > 0 && !$store.fileBrowser.isPickerMode()" class="mass-action-toolbar file-mass-toolbar">
              <div class="selection-summary">
                <button
                  type="button"
                  class="selection-close"
                  @click="$store.fileBrowser.clearSelection()"
                  :disabled="$store.fileBrowser.isBulkBusy"
                  title="Clear Selection"
                  aria-label="Clear selection"
                >
                  <x-icon name="close"></x-icon>
                </button>
                <div class="selection-info" x-text="$store.fileBrowser.selectedCountLabel"></div>
              </div>

              <div class="mass-actions">
                <button
                  type="button"
                  class="btn btn-mass export"
                  @click="$store.fileBrowser.bulkDownloadFiles()"
                  :disabled="$store.fileBrowser.isBulkBusy"
                  title="Download Selected Items"
                  x-show="$store.fileBrowser.remoteAllowed('download')"
                >
                  <x-icon name="folder_zip"></x-icon>
                  Download ZIP
                </button>

                <button
                  type="button"
                  class="btn btn-mass delete"
                  @click="$confirmClick($event, () => $store.fileBrowser.bulkDeleteFiles())"
                  :disabled="$store.fileBrowser.isBulkBusy"
                  title="Delete Selected Items"
                  x-show="$store.fileBrowser.remoteAllowed('delete')"
                  aria-label="Delete selected items"
                >
                  <x-icon name="delete"></x-icon>
                </button>
              </div>
            </div>

            <div class="file-browser-workspace">
              <div class="file-browser-list-pane">
                <!-- Files list -->
                <div
                  class="files-list"
                  :inert="$store.fileBrowser.isLoading || $store.fileBrowser.isRenaming || $store.fileBrowser.isBulkBusy"
                  :class="{ 'file-icons-view': $store.fileBrowser.preferences.view === 'icons', 'is-loading': $store.fileBrowser.isLoading }"
                  @scroll="$store.fileBrowser.closeDropdown(); closeMenu()"
                >
                  <div class="file-header">
                    <div class="file-cell-select">
                      <input
                        type="checkbox"
                        :checked="$store.fileBrowser.allVisibleSelected"
                        :indeterminate="$store.fileBrowser.someVisibleSelected && !$store.fileBrowser.allVisibleSelected"
                        @change="$store.fileBrowser.toggleSelectAllVisible()"
                        :disabled="$store.fileBrowser.selectableEntries.length === 0"
                        title="Select visible items"
                        aria-label="Select visible items"
                      />
                    </div>
                    <div class="file-cell" @click="$store.fileBrowser.toggleSort('name')">
                      Name
                      <span
                        x-show="$store.fileBrowser.browser.sortBy === 'name'"
                        x-text="$store.fileBrowser.browser.sortDirection === 'asc' ? '↑' : '↓'"
                      ></span>
                    </div>
                    <div class="file-cell-size" @click="$store.fileBrowser.toggleSort('size')">
                      Size
                      <span
                        x-show="$store.fileBrowser.browser.sortBy === 'size'"
                        x-text="$store.fileBrowser.browser.sortDirection === 'asc' ? '↑' : '↓'"
                      ></span>
                    </div>
                    <div class="file-cell-date" @click="$store.fileBrowser.toggleSort('date')">
                      Modified
                      <span
                        x-show="$store.fileBrowser.browser.sortBy === 'date'"
                        x-text="$store.fileBrowser.browser.sortDirection === 'asc' ? '↑' : '↓'"
                      ></span>
                    </div>
                    <div class="file-cell-actions"></div>
                  </div>

                  <!-- File list entries -->
                  <template x-if="$store.fileBrowser.visibleEntries.length">
                    <template x-for="file in $store.fileBrowser.visibleEntries" :key="file.path">
                      <div
                        class="file-item"
                        @click="$store.fileBrowser.handleFileNameClick(file)"
                        :data-is-dir="file.is_dir"
                        :draggable="!$store.fileBrowser.isPickerMode() && !$store.fileBrowser.isBulkBusy"
                        :class="{
                        'selected': file.selected,
                        'is-dragging': $store.fileBrowser.isDraggingPath(file.path),
                        'is-drop-target': file.is_dir && $store.fileBrowser.dragOverPath === file.path
                      }"
                        @dragstart="$store.fileBrowser.startDrag(file, $event)"
                        @dragend="$store.fileBrowser.clearDragState()"
                        @dragover="file.is_dir && $store.fileBrowser.setDropTarget(file.path, $event)"
                        @dragleave="file.is_dir && $store.fileBrowser.clearDropTarget(file.path, $event)"
                        @drop="file.is_dir && $store.fileBrowser.dropItems(file.path, file.name, $event)"
                      >
                        <label class="file-select-cell" @click.stop>
                          <template x-if="!$store.fileBrowser.isTextOpenPicker() || !file.is_dir">
                            <input
                              type="checkbox"
                              x-model="file.selected"
                              :disabled="!$store.fileBrowser.isSelectableEntry(file)"
                              :aria-label="`Select ${file.name}`"
                            />
                          </template>
                        </label>
                        <div class="file-name">
                          <template x-if="file.is_dir">
                            <x-icon name="folder" class="file-icon file-folder-icon"></x-icon>
                          </template>
                          <template x-if="!file.is_dir">
                            <img
                              :src="'/public/' + (file.type === 'unknown' ? 'file' : ($store.fileBrowser.isArchive(file.name) ? 'archive' : file.type)) + '.svg'"
                              class="file-icon"
                              :alt="file.type"
                              draggable="false"
                            />
                          </template>
                          <span x-text="file.name"></span>
                        </div>
                        <div class="file-size" x-text="file.is_dir ? '—' : $store.fileBrowser.formatFileSize(file.size)"></div>
                        <div class="file-date" x-text="$store.fileBrowser.formatDate(file.modified)"></div>
                        <div class="file-actions" x-data="{ fileActions: $el }" x-show="!$store.fileBrowser.isPickerMode()" @click.stop>
                          <!-- Secondary single-item actions (Rename/...) are grouped under a dropdown -->
                          <div
                            class="dropdown file-actions-dropdown"
                            @click.outside="$store.fileBrowser.closeDropdown()"
                            @keydown.escape.window="$store.fileBrowser.closeDropdown()"
                          >
                            <button
                              type="button"
                              class="btn-icon-action dropdown-trigger"
                              @click.stop="$store.fileBrowser.toggleDropdown(file.path, $event.currentTarget)"
                              :aria-expanded="$store.fileBrowser.isDropdownOpen(file.path, fileActions).toString()"
                              aria-label="More actions"
                              title="More actions"
                            >
                              <x-icon name="more_vert"></x-icon>
                            </button>

                            <template x-teleport="body">
                              <div
                                class="dropdown-menu file-actions-menu"
                                x-show="$store.fileBrowser.isDropdownOpen(file.path, fileActions)"
                                x-transition
                                :style="$store.fileBrowser.dropdownStyle"
                                style="display: none"
                                @click.stop="$store.fileBrowser.closeDropdown()"
                              >
                                <button
                                  type="button"
                                  class="dropdown-item"
                                  x-show="$store.fileBrowser.isEditableFile(file)"
                                  @click="$store.fileBrowser.openFileEditor(file)"
                                >
                                  <x-icon name="edit"></x-icon>
                                  <span>Edit</span>
                                </button>

                                <button
                                  type="button"
                                  class="dropdown-item"
                                  x-show="$store.fileBrowser.canOpenInActionMenu(file)"
                                  @click="$store.fileBrowser.openInSurface(file)"
                                  :title="$store.fileBrowser.surfaceActionTitle(file)"
                                >
                                  <x-icon :name="$store.fileBrowser.surfaceActionIcon(file)"></x-icon>
                                  <span x-text="$store.fileBrowser.surfaceActionLabel(file)"></span>
                                </button>

                                <button
                                  type="button"
                                  class="dropdown-item"
                                  x-show="file.is_dir && $store.fileBrowser.remoteAllowed('download', file)"
                                  @click="$store.fileBrowser.downloadFile(file)"
                                >
                                  <x-icon name="folder_zip"></x-icon>
                                  <span>Download ZIP</span>
                                </button>

                                <button
                                  type="button"
                                  class="dropdown-item"
                                  x-show="!file.is_dir && !$store.fileBrowser.isRemote(file.path) && $store.fileBrowser.isArchive(file.name)"
                                  @click="$store.fileBrowser.extractArchive(file)"
                                >
                                  <x-icon name="unarchive"></x-icon>
                                  <span>Extract</span>
                                </button>

                                <button
                                  type="button"
                                  class="dropdown-item"
                                  x-show="$store.fileBrowser.remoteAllowed('rename', file)"
                                  @click="$store.fileBrowser.beginRename(file)"
                                >
                                  <x-icon name="drive_file_rename_outline"></x-icon>
                                  <span>Rename</span>
                                </button>
                                <template x-if="$store.fileBrowser.isDropdownOpen(file.path, fileActions)">
                                  <x-extension id="file-browser-actions-menu"></x-extension>
                                </template>
                              </div>
                            </template>
                          </div>
                          <button
                            class="btn-icon-action"
                            x-show="!file.is_dir && $store.fileBrowser.remoteAllowed('download', file)"
                            @click.stop="$store.fileBrowser.downloadFile(file)"
                            title="Download file"
                            aria-label="Download file"
                          >
                            <x-icon name="download"></x-icon>
                          </button>
                          <button
                            class="btn-icon-action danger"
                            x-show="$store.fileBrowser.remoteAllowed('delete', file)"
                            @click.stop="$confirmClick($event, () => $store.fileBrowser.deleteFile(file))"
                            title="Delete item"
                            aria-label="Delete item"
                          >
                            <x-icon name="delete"></x-icon>
                          </button>
                        </div>
                      </div>
                    </template>
                  </template>

                  <!-- Empty state -->
                  <template x-if="!$store.fileBrowser.browser.entries.length && !$store.fileBrowser.isLoading">
                    <div class="no-files">No files found</div>
                  </template>
                  <template x-if="$store.fileBrowser.browser.entries.length && !$store.fileBrowser.visibleEntries.length">
                    <div class="no-files">
                      <div>No matching files found</div>
                      <button class="btn btn-cancel btn-clear-search" @click="$store.fileBrowser.clearSearch()">
                        <x-icon name="close"></x-icon>
                        Clear
                      </button>
                    </div>
                  </template>
                </div>
              </div>
              <div class="file-tree-host" x-show="$store.fileBrowser.fileTree.shown" style="display: none">
                <x-component path="modals/file-browser/file-tree.html" owner="fileBrowser"></x-component>
              </div>
            </div>
          </div>
        </div>
      </template>

      <!-- Modal Footer (outside template x-if so it exists immediately) -->
      <template x-if="$store.fileBrowser">
        <div class="modal-footer file-browser-footer" data-modal-footer :class="{ 'is-surface': xAttrs($el)?.mode === 'canvas' }">
          <div class="file-browser-picker-actions" x-show="$store.fileBrowser.isPickerMode() || $store.fileBrowser.renameInline" style="display: none">
            <template x-if="$store.fileBrowser.renameInline">
              <span class="picker-inline-label" x-text="$store.fileBrowser.renameMode === 'create-folder' ? 'New folder' : 'Rename'"></span>
            </template>
            <template x-if="$store.fileBrowser.isSaveAsPicker() && !$store.fileBrowser.renameInline">
              <input
                type="text"
                class="picker-filename-input"
                x-model="$store.fileBrowser.pickerFilename"
                @input="$store.fileBrowser.onPickerFilenameInput()"
                @keydown.enter.prevent="$store.fileBrowser.confirmPicker()"
                placeholder="File name"
                aria-label="File name"
                spellcheck="false"
              />
            </template>
            <template x-if="$store.fileBrowser.renameInline">
              <input
                type="text"
                class="picker-filename-input"
                x-model="$store.fileBrowser.renameName"
                x-create="$nextTick(() => { if ($el.checkVisibility({checkOpacity: true})) { $el.focus(); $el.select(); } })"
                :disabled="$store.fileBrowser.isRenaming"
                @keydown.escape.stop.prevent="$store.fileBrowser.closeRenameModal()"
                @keydown.enter.prevent="$store.fileBrowser.confirmRename()"
                :placeholder="$store.fileBrowser.renameMode === 'create-folder' ? 'Folder name' : 'New name'"
